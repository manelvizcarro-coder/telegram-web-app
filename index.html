<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú CF d'informàtica - Galàctic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos de fondo galáctico y espacial */
    body {
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Animación de estrellas de fondo */
    .space-stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat top center;
      z-index: 0;
      animation: move-stars 200s linear infinite;
      opacity: 0.6;
    }

    @keyframes move-stars {
      from { background-position: 0 0; }
      to { background-position: 10000px 5000px; }
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 1;
    }

    /* Título Tecnológico */
    .tech-title {
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    /* Contenedor de Botones de Estrella 3D */
    .star-nav-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    /* Botón Estrella 3D */
    .star-btn {
      position: relative;
      width: 90px;
      height: 90px;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: float 4s ease-in-out infinite;
    }

    .star-btn:nth-child(2) { animation-delay: 1.3s; }
    .star-btn:nth-child(3) { animation-delay: 2.6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    /* Icono de Estrella en 3D con Gradiente */
    .star-icon {
      font-size: 80px;
      background: linear-gradient(135deg, #ffe000 0%, #799f0c 0%, #ffe000 50%, #ffaa00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 8px 12px rgba(255, 215, 0, 0.5)) 
              drop-shadow(0px 0px 20px rgba(255, 170, 0, 0.8));
      transition: all 0.3s ease;
    }

    .star-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      font-weight: 900;
      font-size: 1.1rem;
      color: #0d1b2a;
      text-shadow: 0px 1px 2px rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* Efectos Hover y Active para las Estrellas 3D */
    .star-btn:hover {
      transform: scale(1.15) translateY(-5px);
    }

    .star-btn:hover .star-icon {
      filter: drop-shadow(0px 12px 20px rgba(0, 242, 254, 0.8)) 
              drop-shadow(0px 0px 30px rgba(0, 242, 254, 1));
    }

    .star-btn.active .star-icon {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 10px 15px rgba(0, 242, 254, 0.6)) 
              drop-shadow(0px 0px 25px rgba(79, 172, 254, 0.9));
    }

    .star-btn.active .star-label {
      color: #ffffff;
      text-shadow: 0px 0px 5px #000;
    }

    /* Panel Estilo Holo-Glassmorphism */
    .holo-card {
      background: rgba(16, 26, 43, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  inset 0 0 15px rgba(0, 242, 254, 0.1);
      margin-top: 20px;
      transition: all 0.5s ease;
    }

    .tab-pane {
      font-size: 1.25rem;
      text-align: center;
      line-height: 1.6;
      color: #e0f7fa;
    }

    .badge-tech {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 15px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Fondo animado de galaxia/espacio -->
  <div class="space-stars"></div>

  <div class="container py-4">
    <!-- Encabezado con estética tecnológica -->
    <header class="text-center mb-4">
      <span class="badge-tech"><i class="fa-solid fa-microchip me-1"></i> Telegram Web App</span>
      <h1 class="tech-title h2">Cicles Formatius d'Informàtica</h1>
    </header>

    <!-- Menú de navegación con Estrellas 3D -->
    <div class="star-nav-container nav nav-tabs border-0" id="starTab" role="tablist">
      
      <button class="star-btn active" id="s1-tab" data-bs-toggle="tab" data-bs-target="#s1" type="button" role="tab" aria-controls="s1" aria-selected="true">
        <i class="fa-solid fa-star star-icon"></i>
        <span class="star-label">SMX</span>
      </button>

      <button class="star-btn" id="s2-tab" data-bs-toggle="tab" data-bs-target="#s2" type="button" role="tab" aria-controls="s2" aria-selected="false">
        <i class="fa-solid fa-star star-icon"></i>
        <span class="star-label">ASIX</span>
      </button>

      <button class="star-btn" id="s3-tab" data-bs-toggle="tab" data-bs-target="#s3" type="button" role="tab" aria-controls="s3" aria-selected="false">
        <i class="fa-solid fa-star star-icon"></i>
        <span class="star-label">DAM</span>
      </button>

    </div>

    <!-- Panel de contenido con información original -->
    <div class="holo-card">
      <div class="tab-content" id="starTabContent">
        <div class="tab-pane fade show active" id="s1" role="tabpanel" aria-labelledby="s1-tab">
          <i class="fa-solid fa-desktop text-info mb-3 d-block display-5"></i>
          Explicació SMX: M1 Muntatge, M2 SOM
        </div>
        <div class="tab-pane fade" id="s2" role="tabpanel" aria-labelledby="s2-tab">
          <i class="fa-solid fa-shield-halved text-info mb-3 d-block display-5"></i>
          Explicació ASIX: M1 Sistemes Informàtics, M2 Ciberseguretat
        </div>
        <div class="tab-pane fade" id="s3" role="tabpanel" aria-labelledby="s3-tab">
          <i class="fa-solid fa-code text-info mb-3 d-block display-5"></i>
          Explcació DAM: M1 Sistemes Informàtics, M2 Programació
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
